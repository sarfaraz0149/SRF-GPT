<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>SRF-GPT</title>

  <!-- Lightweight, fast CSS - independent of CDN delays -->
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }
    html, body {
      height: 100%;
      width: 100%;
      background-color: #131314;
      color: #e3e3e3;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      overflow: hidden;
    }
    button {
      cursor: pointer;
      border: none;
      outline: none;
      background: transparent;
      color: inherit;
      font: inherit;
    }
    input, textarea {
      border: none;
      outline: none;
      font: inherit;
      color: inherit;
    }

    /* Layout */
    .app-wrapper {
      display: flex;
      height: 100%;
      width: 100%;
      position: relative;
      overflow: hidden;
    }

    /* Sidebar drawer */
    #sidebar-drawer {
      position: fixed;
      top: 0;
      bottom: 0;
      left: 0;
      width: 280px;
      background-color: #18191a;
      border-right: 1px solid #333537;
      z-index: 100;
      display: flex;
      flex-direction: column;
      transform: translateX(-100%);
      transition: transform 0.22s ease-in-out;
    }
    #sidebar-drawer.open {
      transform: translateX(0);
      box-shadow: 4px 0 24px rgba(0,0,0,0.8);
    }
    @media (min-width: 769px) {
      #sidebar-drawer {
        position: relative;
        transform: translateX(0);
        z-index: 10;
      }
      #sidebar-drawer.desktop-hidden {
        display: none !important;
      }
    }

    /* Overlay */
    #overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.7);
      z-index: 90;
      display: none;
    }

    /* Main chat container */
    .main-view {
      flex: 1;
      display: flex;
      flex-direction: column;
      height: 100%;
      min-width: 0;
      background-color: #131314;
      position: relative;
    }

    /* Header */
    .top-header {
      height: 56px;
      border-bottom: 1px solid #333537;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 12px;
      background: #131314;
      flex-shrink: 0;
    }
    .brand-title {
      font-weight: 700;
      font-size: 1.1rem;
      background: linear-gradient(90deg, #60a5fa, #a5b4fc, #c084fc);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    /* Notice banner */
    #alert-banner {
      background: #451a03;
      color: #fde68a;
      font-size: 12px;
      padding: 8px 12px;
      border-bottom: 1px solid #78350f;
      display: none;
      align-items: center;
      justify-content: space-between;
    }

    /* Chat Messages */
    #chat-scroll {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
    }
    .chat-inner {
      max-width: 680px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    .msg-user {
      align-self: flex-end;
      background-color: #2b2c2f;
      color: #fff;
      padding: 10px 14px;
      border-radius: 16px 16px 2px 16px;
      font-size: 14px;
      line-height: 1.5;
      max-width: 85%;
      border: 1px solid #333537;
      word-break: break-word;
    }
    .msg-bot-wrap {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      max-width: 95%;
    }
    .bot-avatar {
      width: 24px;
      height: 24px;
      border-radius: 50%;
      background: linear-gradient(135deg, #3b82f6, #6366f1);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 11px;
      font-weight: bold;
      color: #fff;
      flex-shrink: 0;
      margin-top: 2px;
    }
    .msg-bot {
      color: #e3e3e3;
      font-size: 14px;
      line-height: 1.6;
      word-break: break-word;
      overflow: hidden;
    }
    .msg-bot pre {
      background: #000;
      border: 1px solid #333;
      padding: 8px 12px;
      border-radius: 6px;
      margin: 8px 0;
      overflow-x: auto;
      color: #8ab4f8;
      font-family: monospace;
      font-size: 13px;
    }

    /* Input section */
    .input-wrapper {
      padding: 12px;
      background: #131314;
      border-top: 1px solid #232427;
      flex-shrink: 0;
    }
    .input-box {
      max-width: 680px;
      margin: 0 auto;
      background: #1e1f20;
      border: 1px solid #333537;
      border-radius: 18px;
      padding: 8px 12px;
      display: flex;
      flex-direction: column;
      transition: border 0.15s;
    }
    .input-box:focus-within {
      border-color: #8ab4f8;
    }
    #user-prompt {
      width: 100%;
      background: transparent;
      resize: none;
      color: #fff;
      font-size: 14px;
      line-height: 1.4;
      max-height: 120px;
      overflow-y: auto;
    }
    .input-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-top: 6px;
      padding-top: 6px;
      border-top: 1px solid rgba(255,255,255,0.06);
    }
    .btn-send {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background: #8ab4f8;
      color: #000;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: transform 0.1s, opacity 0.1s;
    }
    .btn-send:active { transform: scale(0.92); }
    .btn-send:disabled { opacity: 0.4; }

    /* Modal - Uses high z-index and clear flex overlay */
    #settings-modal {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.8);
      z-index: 9999;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }
    .modal-box {
      background: #1e1f20;
      border: 1px solid #333537;
      border-radius: 14px;
      width: 100%;
      max-width: 360px;
      padding: 18px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.8);
    }
    .modal-title-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid #333537;
      padding-bottom: 10px;
      margin-bottom: 14px;
    }
    .field-group {
      margin-bottom: 14px;
    }
    .field-group label {
      display: block;
      font-size: 12px;
      color: #9aa0a6;
      margin-bottom: 4px;
    }
    .field-group input {
      width: 100%;
      background: #121213;
      border: 1px solid #333537;
      border-radius: 8px;
      padding: 8px 10px;
      font-size: 13px;
      color: #fff;
    }
    .field-group input:focus {
      border-color: #8ab4f8;
    }
    .modal-actions {
      display: flex;
      justify-content: flex-end;
      gap: 8px;
      border-top: 1px solid #333537;
      padding-top: 12px;
    }
    .btn-save {
      background: #8ab4f8;
      color: #000;
      font-weight: 600;
      padding: 6px 14px;
      border-radius: 8px;
      font-size: 13px;
    }

    .cursor-active::after {
      content: '▋';
      margin-left: 2px;
      color: #8ab4f8;
      animation: blink 0.8s infinite;
    }
    @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }
  </style>
</head>
<body>

  <!-- Backdrop overlay for mobile sidebar -->
  <div id="overlay" onclick="closeSidebar()"></div>

  <div class="app-wrapper">

    <!-- SIDEBAR -->
    <aside id="sidebar-drawer">
      <div style="padding: 12px; border-bottom: 1px solid #333537; display: flex; align-items: center; justify-content: space-between; gap: 8px;">
        <button onclick="newConversation()" style="flex: 1; display: flex; align-items: center; justify-content: center; gap: 6px; padding: 8px 12px; background: #232427; border: 1px solid #333537; border-radius: 20px; font-size: 12px; color: #fff;">
          <span style="font-size: 16px; color: #8ab4f8;">+</span>
          <span>New Chat</span>
        </button>
        <button onclick="closeSidebar()" style="padding: 8px; font-size: 16px; color: #9aa0a6;" title="Close menu">✕</button>
      </div>

      <div style="padding: 10px 14px; font-size: 11px; font-weight: 600; color: #9aa0a6; text-transform: uppercase;">
        Recent Chats
      </div>

      <div id="history-list" style="flex: 1; overflow-y: auto; padding: 0 8px;"></div>

      <div style="padding: 12px; border-top: 1px solid #333537; background: #141415;">
        <div style="font-size: 12px; color: #9aa0a6; margin-bottom: 8px;">
          Built by <strong style="color: #fff;">Shaik Sarfaraz</strong>
        </div>
        <button onclick="showSettings()" style="width: 100%; display: flex; align-items: center; justify-content: center; gap: 6px; padding: 8px; background: #232427; border-radius: 8px; font-size: 13px; color: #8ab4f8;">
          ⚙️ Settings & API Key
        </button>
      </div>
    </aside>

    <!-- MAIN CHAT VIEW -->
    <main class="main-view">
      
      <header class="top-header">
        <div style="display: flex; align-items: center; gap: 8px;">
          <button onclick="toggleSidebar()" style="padding: 6px 10px; font-size: 20px; color: #fff;" title="Menu">☰</button>
          <span class="brand-title">SRF-GPT</span>
          <span id="label-model" style="font-size: 10px; padding: 2px 6px; border-radius: 12px; background: #1e1f20; border: 1px solid #333537; color: #9aa0a6;"></span>
        </div>

        <div style="display: flex; align-items: center; gap: 4px;">
          <button onclick="showSettings()" style="padding: 8px; font-size: 16px;" title="Settings">⚙️</button>
          <button onclick="clearChat()" style="padding: 8px; font-size: 16px;" title="Clear chat">🗑️</button>
        </div>
      </header>

      <div id="alert-banner">
        <span id="alert-text">Notice</span>
        <button onclick="hideAlert()" style="font-weight: bold; padding: 0 4px;">✕</button>
      </div>

      <div id="chat-scroll">
        <div id="chat-area" class="chat-inner"></div>
      </div>

      <div class="input-wrapper">
        <div class="input-box">
          <textarea
            id="user-prompt"
            rows="1"
            placeholder="Ask SRF-GPT..."
            oninput="autoResize(this)"
            onkeydown="checkEnter(event)"
          ></textarea>
          <div class="input-footer">
            <span style="font-size: 11px; color: #9aa0a6;">By Shaik Sarfaraz</span>
            <button id="send-button" class="btn-send" onclick="submitMessage()">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor">
                <path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/>
              </svg>
            </button>
          </div>
        </div>
      </div>

    </main>
  </div>

  <!-- SETTINGS MODAL -->
  <div id="settings-modal">
    <div class="modal-box">
      <div class="modal-title-row">
        <strong style="color: #fff; font-size: 14px;">SRF-GPT Settings</strong>
        <button onclick="hideSettings()" style="font-size: 16px; color: #9aa0a6;">✕</button>
      </div>

      <div class="field-group">
        <label>OpenRouter API Key</label>
        <input type="password" id="input-key" placeholder="sk-or-v1-...">
      </div>

      <div class="field-group">
        <label>Model Name</label>
        <input type="text" id="input-model" placeholder="google/gemini-2.0-flash-exp:free">
      </div>

      <div class="modal-actions">
        <button onclick="hideSettings()" style="padding: 6px 12px; font-size: 13px; color: #9aa0a6;">Cancel</button>
        <button onclick="saveSettings()" class="btn-save">Save</button>
      </div>
    </div>
  </div>

  <!-- Markdown parser script -->
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

  <script>
    var DEFAULT_MODEL = "google/gemini-2.0-flash-exp:free";
    var SYSTEM_PROMPT = {
      role: "system",
      content: "You are SRF-GPT, an intelligent assistant created by Shaik Sarfaraz. When asked who made you or who created you, always state clearly that you were created by Shaik Sarfaraz."
    };

    var apiKey = localStorage.getItem("srf_key") || "";
    var currentModel = localStorage.getItem("srf_model") || DEFAULT_MODEL;
    var sessions = [];
    try {
      sessions = JSON.parse(localStorage.getItem("srf_chats")) || [];
    } catch(e) {
      sessions = [];
    }
    var currentSessionId = localStorage.getItem("srf_active_id") || null;
    var isGenerating = false;

    // Direct toggle functions
    function toggleSidebar() {
      var sidebar = document.getElementById("sidebar-drawer");
      var overlay = document.getElementById("overlay");
      if (window.innerWidth <= 768) {
        if (sidebar.classList.contains("open")) {
          closeSidebar();
        } else {
          sidebar.classList.add("open");
          overlay.style.display = "block";
        }
      } else {
        sidebar.classList.toggle("desktop-hidden");
      }
    }

    function closeSidebar() {
      document.getElementById("sidebar-drawer").classList.remove("open");
      document.getElementById("overlay").style.display = "none";
    }

    // Modal controls using explicit inline display
    function showSettings() {
      document.getElementById("input-key").value = apiKey;
      document.getElementById("input-model").value = currentModel;
      document.getElementById("settings-modal").style.display = "flex";
      closeSidebar();
    }

    function hideSettings() {
      document.getElementById("settings-modal").style.display = "none";
    }

    function saveSettings() {
      apiKey = document.getElementById("input-key").value.trim();
      currentModel = document.getElementById("input-model").value.trim() || DEFAULT_MODEL;
      localStorage.setItem("srf_key", apiKey);
      localStorage.setItem("srf_model", currentModel);
      document.getElementById("label-model").textContent = currentModel;
      hideSettings();
      if (apiKey) hideAlert();
    }

    function showAlert(text) {
      document.getElementById("alert-text").textContent = text;
      document.getElementById("alert-banner").style.display = "flex";
    }

    function hideAlert() {
      document.getElementById("alert-banner").style.display = "none";
    }

    function autoResize(textarea) {
      textarea.style.height = "auto";
      textarea.style.height = Math.min(textarea.scrollHeight, 120) + "px";
    }

    function checkEnter(e) {
      if (e.key === "Enter" && !e.shiftKey) {
        e.preventDefault();
        submitMessage();
      }
    }

    function safeFormat(text) {
      if (window.marked && typeof window.marked.parse === "function") {
        try { return window.marked.parse(text || ""); } catch(e) {}
      }
      return (text || "").replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/\n/g, "<br>");
    }

    function saveState() {
      localStorage.setItem("srf_chats", JSON.stringify(sessions));
      localStorage.setItem("srf_active_id", currentSessionId);
    }

    function getCurrentChat() {
      for (var i = 0; i < sessions.length; i++) {
        if (sessions[i].id === currentSessionId) return sessions[i];
      }
      return null;
    }

    function newConversation() {
      var id = "c_" + Date.now();
      sessions.unshift({ id: id, title: "New Chat", messages: [] });
      currentSessionId = id;
      saveState();
      renderHistory();
      renderChatMessages();
      closeSidebar();
    }

    function clearChat() {
      var chat = getCurrentChat();
      if (chat) {
        chat.messages = [];
        chat.title = "New Chat";
        saveState();
        renderHistory();
        renderChatMessages();
      }
    }

    function renderHistory() {
      var box = document.getElementById("history-list");
      box.innerHTML = "";
      sessions.forEach(function(s) {
        var isCurrent = (s.id === currentSessionId);
        var item = document.createElement("div");
        item.style.cssText = "display: flex; align-items: center; justify-content: space-between; padding: 8px 10px; margin-bottom: 4px; border-radius: 8px; font-size: 13px; cursor: pointer; background: " + (isCurrent ? "#2a2b2e" : "transparent") + "; color: " + (isCurrent ? "#fff" : "#9aa0a6") + ";";

        item.innerHTML = '<span style="overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1; padding-right: 8px;">' + (s.title || "New Chat") + '</span>' +
          '<button style="color: #666; font-size: 12px; padding: 2px 4px;">✕</button>';

        item.onclick = function() {
          currentSessionId = s.id;
          saveState();
          renderHistory();
          renderChatMessages();
          closeSidebar();
        };

        item.querySelector("button").onclick = function(e) {
          e.stopPropagation();
          sessions = sessions.filter(function(item) { return item.id !== s.id; });
          if (sessions.length === 0) {
            newConversation();
          } else {
            if (currentSessionId === s.id) currentSessionId = sessions[0].id;
            saveState();
            renderHistory();
            renderChatMessages();
          }
        };

        box.appendChild(item);
      });
    }

    function renderChatMessages() {
      var container = document.getElementById("chat-area");
      container.innerHTML = "";
      var chat = getCurrentChat();

      if (!chat || chat.messages.length === 0) {
        container.innerHTML = '<div style="text-align: center; padding: 48px 0;">' +
          '<h2 class="brand-title" style="font-size: 22px; margin-bottom: 6px;">SRF-GPT</h2>' +
          '<p style="font-size: 13px; color: #9aa0a6;">Created by <strong style="color: #fff;">Shaik Sarfaraz</strong></p>' +
          '<p style="font-size: 12px; color: #666; margin-top: 4px;">Enter a prompt below to begin chatting.</p>' +
          '</div>';
        return;
      }

      chat.messages.forEach(function(m) {
        appendBubble(m.role, m.content);
      });

      var scroller = document.getElementById("chat-scroll");
      scroller.scrollTop = scroller.scrollHeight;
    }

    function appendBubble(role, text) {
      var isUser = (role === "user");
      var container = document.getElementById("chat-area");
      var row = document.createElement("div");

      if (isUser) {
        row.style.display = "flex";
        row.style.justifyContent = "flex-end";
        row.innerHTML = '<div class="msg-user">' + (text || "").replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/\n/g, "<br>") + '</div>';
      } else {
        row.innerHTML = '<div class="msg-bot-wrap">' +
          '<div class="bot-avatar">S</div>' +
          '<div class="msg-bot">' + safeFormat(text) + '</div>' +
          '</div>';
      }

      container.appendChild(row);
      var scroller = document.getElementById("chat-scroll");
      scroller.scrollTop = scroller.scrollHeight;
      return row;
    }

    async function submitMessage() {
      var input = document.getElementById("user-prompt");
      var text = input.value.trim();
      if (!text || isGenerating) return;

      if (!apiKey) {
        showAlert("OpenRouter API Key required. Opening Settings...");
        showSettings();
        return;
      }

      var chat = getCurrentChat();
      if (!chat) return;

      if (chat.messages.length === 0) {
        chat.title = text.slice(0, 22) + (text.length > 22 ? "..." : "");
        renderHistory();
      }

      chat.messages.push({ role: "user", content: text });
      saveState();

      renderChatMessages();
      input.value = "";
      input.style.height = "auto";

      isGenerating = true;
      document.getElementById("send-button").disabled = true;

      var botRow = appendBubble("assistant", "");
      var botTextTarget = botRow.querySelector(".msg-bot");
      botTextTarget.classList.add("cursor-active");

      var responseText = "";

      try {
        var res = await fetch("https://openrouter.ai/api/v1/
